<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explosão de Amor ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;700&display=swap');
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: pink;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            text-align: center;
            position: relative;
        }
        #instruction {
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
            font-family: 'Pacifico', cursive;
            position: absolute;
            top: 20px;
        }
        #heart {
            width: 100px;
            height: 100px;
            background: red;
            position: relative;
            transform: rotate(-45deg);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
        }
        #heart::before, #heart::after {
            content: "";
            width: 100px;
            height: 100px;
            background: red;
            border-radius: 50%;
            position: absolute;
        }
        #heart::before {
            top: -50px;
            left: 0;
        }
        #heart::after {
            left: 50px;
            top: 0;
        }
        #message {
            display: none;
            font-size: 26px;
            color: red;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
            font-family: 'Pacifico', cursive;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: red;
            opacity: 0.7;
            border-radius: 50%;
            animation: fall 1.5s linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0); opacity: 0; }
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(2); opacity: 0.5; }
            100% { transform: scale(5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="instruction">Clique no coração</div>
    <div id="heart"></div>
    <div id="message">Meu anjinho, sei que a competição foi difícil. Mas você sempre vai ser o número um para mim. Eu te amo de coração e estou morrendo de saudade! Arrasei nesse site? Kkkk. Te amo, Caduzinhoooo!!!!!!</div>
    
    <script>
        let clicks = 0;
        const heart = document.getElementById("heart");
        const message = document.getElementById("message");
        const instruction = document.getElementById("instruction");

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                let confetti = document.createElement("div");
                confetti.classList.add("confetti");
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = `${Math.random() * 100}vh`;
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 1500);
            }
        }

        heart.addEventListener("click", () => {
            clicks++;
            heart.style.transform = `scale(${1 + clicks * 0.1}) rotate(-45deg)`;
            
            if (clicks >= 10) {
                heart.style.animation = "explode 0.5s ease-out forwards";
                setTimeout(() => {
                    heart.style.display = "none";
                    instruction.style.display = "none";
                    message.style.display = "block";
                    createConfetti();
                }, 500);
            }
        });
    </script>
</body>
</html>
